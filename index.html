<div class="wrap" id="app"></div>
<input type="file" id="cam" accept="image/*" capture="environment" multiple class="hide">
<input type="file" id="pick" accept="image/*" multiple class="hide">
<input type="file" id="imp" accept="application/json,.json" class="hide">

<script>
/* ═══ 저장소 ═══ */
const mem={};
const LS={
  get:k=>{try{return localStorage.getItem(k)}catch(e){return k in mem?mem[k]:null}},
  set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){mem[k]=v}},
  del:k=>{try{localStorage.removeItem(k)}catch(e){delete mem[k]}},
  keys:()=>{try{return Object.keys(localStorage)}catch(e){return Object.keys(mem)}}
};
const getJ=(k,d)=>{try{return JSON.parse(LS.get(k))??d}catch(e){return d}};
const setJ=(k,v)=>LS.set(k,JSON.stringify(v));

const KEY='jq:key', MODEL='jq:model', PROF='jq:profile', IDX='jq:index';
let S={view:'home',shots:[],want:20,err:'',prog:null,set:null,qi:0,ans:[],typed:'',
       locked:false,pair:null,sheet:null,picked:[]};

/* ═══ 유틸 ═══ */
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RUBY=/([\u4e00-\u9fff々ヶ]+)[（(]([ぁ-んァ-ヶー]+)[)）]/g;
const plain=t=>String(t||'').replace(RUBY,'$1');
function ruby(t,strip){
  if(!t)return'';
  return esc(String(t)).replace(RUBY,(m,k,r)=>strip?k:`<ruby>${k}<rt>${r}</rt></ruby>`);
}
const norm=s=>String(s||'').trim().toLowerCase().replace(/[\s・、。,.]/g,'')
  .replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const today=()=>{const d=new Date(),p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())}`};
const shuffle=a=>{const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.random()*(i+1)|0;
  [r[i],r[j]]=[r[j],r[i]]}return r};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function shrink(file,max,q){return new Promise((res,rej)=>{
  const img=new Image(),fr=new FileReader();
  fr.onerror=()=>rej(Error('read'));
  fr.onload=()=>{img.onerror=()=>rej(Error('decode'));
    img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement('canvas');
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      res(c.toDataURL('image/jpeg',q))};
    img.src=fr.result};
  fr.readAsDataURL(file)})}

/* ═══ Gemini 호출 ═══ */
function setNote(t){const e=document.getElementById('pn');if(e)e.textContent=t}
async function ask(parts){
  const key=(LS.get(KEY)||'').trim(), model=LS.get(MODEL)||'gemini-3.6-flash';
  const base=`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
  // auth 0: x-goog-api-key 헤더 / 1: ?key= 쿼리
  // mode 0: 생각끄기+JSON / 1: JSON만 / 2: 옵션 없음
  let auth=0, mode=0, lastErr='';
  for(let t=0;t<8;t++){
    const gc={temperature:.8,maxOutputTokens:8192};
    if(mode<2)gc.responseMimeType='application/json';
    if(mode<1)gc.thinkingConfig={thinkingBudget:0};
    const url=base+(auth===1?'?key='+encodeURIComponent(key):'');
    const headers={'Content-Type':'application/json'};
    if(auth===0)headers['x-goog-api-key']=key;

    const ctl=new AbortController(), t0=Date.now();
    const tk=setInterval(()=>setNote(`${Math.round((Date.now()-t0)/1000)}초 · 시도 ${t+1}`),1000);
    const to=setTimeout(()=>ctl.abort(),90000);
    let r;
    try{
      r=await fetch(url,{method:'POST',headers,body:JSON.stringify({contents:[{role:'user',parts}],
        generationConfig:gc}),signal:ctl.signal});
    }catch(e){
      if(e.name==='AbortError')throw Error('90초 동안 응답이 없어 중단했습니다. Wi-Fi에서 다시 해보세요.');
      throw Error('네트워크 오류: '+e.message);
    }finally{clearInterval(tk);clearTimeout(to)}

    if(r.status===429||r.status===503){
      let wait=Math.min(70,10*(t+1));
      try{
        const j=await r.json();
        const det=(j&&j.error&&j.error.details)||[];
        for(const x of det){
          const rd=x&&(x.retryDelay||x.retry_delay);
          if(rd){const s=parseInt(rd,10);if(s>0)wait=Math.min(90,s+3)}
        }
      }catch(e){}
      for(let s=wait;s>0;s--){setNote(`무료 한도 대기 ${s}초`);await sleep(1000)}
      continue;
    }
    const d=await r.json().catch(()=>({error:{message:'응답을 읽지 못했습니다 ('+r.status+')'}}));

    if(d.error){
      const m=d.error.message||'API 오류', code=d.error.code||r.status;
      lastErr=m;
      if(code===401||code===403||/ACCESS_TOKEN_TYPE|invalid authentication|UNAUTHENTICATED|PERMISSION_DENIED|api[ _]?key/i.test(m)){
        if(auth===0){auth=1;continue}     // 헤더가 막히면 쿼리로 재시도
        throw Error('키 인증에 실패했습니다.\n'+m+
          '\n\n→ Google Cloud Console에서 새 프로젝트를 만들고 그 프로젝트로 키를 다시 발급해 보세요.');
      }
      if(/not found|NOT_FOUND|is not supported|does not exist/i.test(m))
        throw Error('모델명 "'+model+'"을 찾을 수 없습니다. 설정에서 gemini-3.6-flash 로 바꿔 주세요.\n('+m+')');
      if(mode<2){mode++;continue}
      throw Error(m);
    }

    const c=d.candidates&&d.candidates[0];
    if(!c)throw Error('후보 없음 '+JSON.stringify(d).slice(0,180));
    const txt=((c.content&&c.content.parts)||[]).map(p=>p.text||'').join('');
    if(txt)return txt;
    if(mode<2){mode++;continue}
    throw Error('빈 응답 (finishReason: '+(c.finishReason||'?')+')');
  }
  throw Error(lastErr||'요청이 계속 실패했습니다. 1분 뒤 다시 해주세요.');
}
function unwrap(v){
  if(Array.isArray(v))return v;
  if(v&&typeof v==='object'){for(const k in v)if(Array.isArray(v[k]))return v[k]}
  return v;
}
function loose(t){
  const s=String(t).replace(/```json|```/g,'').trim();
  try{return unwrap(JSON.parse(s))}catch(e){
    const a=s.indexOf('['),c=s.lastIndexOf('}');
    if(a<0||c<a)throw e;
    return JSON.parse(s.slice(a,c+1)+']');
  }
}
async function pool(tasks,limit,tick){
  const out=[];out.errors=[];let i=0;
  await Promise.all(Array.from({length:Math.min(limit,tasks.length)},async()=>{
    while(i<tasks.length){const k=i++;
      try{out[k]=await tasks[k]()}catch(e){out[k]=null;out.errors.push(e.message);console.warn(e)}
      tick&&tick()}
  }));
  return out;
}

const EXTRACT=`이 사진에서 일본어를 모두 찾아 학습 항목으로 정리해 주세요.
교재, 손으로 쓴 노트, 필기, 프린트, 칠판, 메모 등 어떤 형태여도 상관없습니다.
글씨가 흐리거나 삐뚤어도 최대한 읽어 주세요.

- 사진에 실제로 보이는 일본어 단어·한자·문형·예문만 사용한다. 사진에 없는 내용은 만들지 않는다.
- 히라가나만 있는 단어, 카타카나 단어도 모두 포함한다.
- 한국어 뜻이 옆에 적혀 있으면 그대로 쓰고, 없으면 직접 채워 넣는다.
- 최대 15개. 한 개라도 찾으면 반드시 배열에 담아 출력한다.
- jp: 일본어 표기. yomi: 히라가나 읽기. ko: 한국어 뜻. ex: 사진 속 예문(없으면 "").

JSON 배열만 출력: [{"jp":"勉強","yomi":"べんきょう","ko":"공부","ex":"毎日勉強します"}]
일본어가 정말 하나도 없을 때만 [] 를 출력한다.`;

const genPrompt=(items,n,avoid)=>`아래는 학습자가 공부한 일본어 항목입니다.
${JSON.stringify(items)}

이 항목만 사용해 시험 문제 ${n}개를 만드세요. JSON 배열만 출력.

형식(4종을 골고루 섞을 것):
{"type":"choice","q":"한국어 질문","jp":"日本語(にほんご)","choices":["","","",""],"answer":0,"explain":"","level":1,"words":[{"w":"日本語","k":"일본어"}]}
{"type":"short","q":"밑줄 친 단어의 읽는 법을 쓰세요","jp":"勉強","answers":["べんきょう"],"explain":"","level":1,"words":[]}
{"type":"write","q":"'공부하다'를 일본어로 쓰세요","jp":"","answers":["勉強する","べんきょうする"],"explain":"","level":2,"words":[]}
{"type":"match","q":"한자와 읽는 법을 연결하세요","pairs":[{"k":"勉強","r":"べんきょう"}],"explain":"","level":1,"words":[]}

난이도를 반드시 섞을 것:
- level 1 (쉬움): 단어 뜻 고르기, 읽는 법, 한자-읽기 연결
- level 2 (보통): 예문의 빈칸 채우기, 조사·활용형 고르기, 뜻 보고 단어 쓰기
- level 3 (어려움): 짧은 문장의 한국어 해석 고르기, 한국어 문장을 일본어로 쓰기
전체의 약 40%를 level 1, 40%를 level 2, 20%를 level 3으로.

예문 문제를 반드시 포함할 것:
- 항목의 ex를 쓰거나, 위 항목의 단어들만 조합해 짧은 예문(10자 내외)을 만든다.
- 예문에 빈칸(＿＿)을 뚫고 들어갈 말을 고르게 하거나, 예문의 뜻을 묻는다.

공통 규칙:
- 모든 한자에 (읽는법) 후리가나를 괄호로 붙인다. 예: 毎日(まいにち)勉強(べんきょう)します
- 단, "short" 문제의 jp에는 후리가나를 절대 붙이지 않는다(정답 노출 금지).
- match는 pairs 정확히 4쌍. pairs의 k에는 후리가나를 붙이지 않는다.
- write의 answers에는 한자·히라가나 표기를 모두 넣는다.
- words: 문제에 나온 주요 단어를 2~5개. 예문 문제면 예문에 쓰인 단어를 모두 넣는다.
  w는 후리가나 없는 일본어 표기, k는 한국어 뜻.
- q는 한국어. explain은 25자 이내 한국어.
${avoid.length?'- 이미 출제된 단어는 피할 것: '+avoid.slice(0,40).join(','):''}`;

/* ═══ 생성 ═══ */
async function build(o){
  const need=S.want, per=10, batches=Math.ceil(need/per);
  S.prog={label:'문제를 만드는 중',done:0,total:batches};render();
  const avoid=o.base?o.base.questions.map(q=>plain(q.jp||(q.pairs?q.pairs[0].k:''))).filter(Boolean):[];
  const tasks=[];
  for(let b=0;b<batches;b++){
    const n=Math.min(per,need-b*per);
    tasks.push(async()=>loose(await ask([{text:genPrompt(shuffle(o.items).slice(0,14),n,avoid)}])));
  }
  const got=await pool(tasks,1,()=>{S.prog.done++;render()});
  const qs=[];
  for(const arr of got){
    if(!Array.isArray(arr))continue;
    for(const q of arr){
      if(!q||!q.q)continue;
      if(q.type==='match'&&(!q.pairs||q.pairs.length<2))continue;
      if(q.type==='choice'&&(!q.choices||q.choices.length<2))continue;
      if((q.type==='short'||q.type==='write')&&!q.answers)continue;
      qs.push(q);
    }
  }
  if(!qs.length)throw Error('문제를 만들지 못했습니다'+(got.errors&&got.errors.length?':\n'+got.errors[0]:''));
  const base=o.base;
  const set={id:base?base.id:'s'+Date.now(), title:base?base.title:o.title,
    date:base?base.date:today(), thumb:base?base.thumb:o.thumb,
    items:o.items, questions:qs.slice(0,need), attempts:base?base.attempts||[]:[]};
  setJ('jq:set:'+set.id,set);
  const idx=getJ(IDX,[]);
  if(base) setJ(IDX,idx.map(r=>r.id===set.id?{...r,total:set.questions.length}:r));
  else setJ(IDX,[{id:set.id,title:set.title,date:set.date,thumb:set.thumb,
    total:set.questions.length,best:null,words:o.items.length},...idx]);
  S.prog=null;begin(set);
}

async function fromPhotos(){
  S.err='';if(!S.shots.length)return;
  S.prog={label:'사진에서 단어를 뽑는 중',done:0,total:S.shots.length};render();
  try{
    let raw='';
    const tasks=S.shots.map(s=>async()=>{
      const t=await ask([{inline_data:{mime_type:'image/jpeg',data:s.full.split(',')[1]}},{text:EXTRACT}]);
      if(!raw)raw=t;
      return loose(t);
    });
    const packs=await pool(tasks,1,()=>{S.prog.done++;render()});
    const items=[],seen=new Set();
    for(const arr of packs)if(Array.isArray(arr))for(const it of arr){
      if(!it||!it.jp||seen.has(it.jp))continue;seen.add(it.jp);items.push(it)}
    if(!items.length){S.prog=null;
      S.err=(packs.errors&&packs.errors.length
        ? '오류가 났습니다:\n'+packs.errors[0]
        : '사진에서 일본어를 찾지 못했습니다.')
        +(raw?'\n\n[응답] '+raw.slice(0,300):'');
      return render()}
    const n=S.shots.length, thumb=S.shots[0].thumb;
    S.shots=[];
    await build({items,thumb,title:`${today()} 노트 ${n}장`});
  }catch(e){S.prog=null;S.err=e.message;render()}
}

async function fromHistory(){
  S.err='';if(!S.picked.length)return;
  const idx=getJ(IDX,[]);
  S.sheet=null;S.prog={label:'공부 기록을 모으는 중',done:0,total:S.picked.length};render();
  try{
    const items=[],seen=new Set();let thumb=null;
    for(const id of S.picked){
      const s=getJ('jq:set:'+id,null);if(!s)continue;
      if(!thumb)thumb=s.thumb;
      for(const it of s.items||[]){if(it&&it.jp&&!seen.has(it.jp)){seen.add(it.jp);items.push(it)}}
      S.prog.done++;render();
    }
    if(!items.length)throw Error('단어가 없습니다');
    const n=S.picked.length;S.picked=[];
    await build({items,thumb,title:`모아 보기 · ${n}회분`});
  }catch(e){S.prog=null;S.err=e.message;render()}
}

async function regen(set){
  S.sheet=null;S.err='';
  try{await build({items:set.items,base:set})}
  catch(e){S.prog=null;S.err=e.message;render()}
}

/* ═══ 진행 ═══ */
function begin(set){Object.assign(S,{set,qi:0,ans:[],typed:'',locked:false,pair:null,view:'quiz'});render()}
function mark(ok,given){S.ans.push({ok,given});S.locked=true;render()}
function submit(pick){
  const q=S.set.questions[S.qi];
  if(q.type==='short'||q.type==='write')
    mark((q.answers||[]).map(norm).includes(norm(S.typed)),S.typed);
  else mark(pick===q.answer,pick);
}
function next(){
  if(S.qi+1<S.set.questions.length){S.qi++;S.typed='';S.locked=false;S.pair=null;return render()}
  const score=S.ans.filter(a=>a.ok).length, total=S.set.questions.length;
  S.set.attempts=[{date:today(),score,total},...(S.set.attempts||[])].slice(0,30);
  setJ('jq:set:'+S.set.id,S.set);
  setJ(IDX,getJ(IDX,[]).map(r=>r.id===S.set.id?
    {...r,best:r.best==null?score:Math.max(r.best,score)}:r));
  S.view='result';render();
}

/* ═══ 백업 ═══ */
function exportAll(){
  const data={v:1,at:new Date().toISOString(),items:{}};
  for(const k of LS.keys())if(k.startsWith('jq:')&&k!==KEY)data.items[k]=LS.get(k);
  const b=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=`tensaku-backup-${today()}.json`;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function importAll(file){
  const fr=new FileReader();
  fr.onload=()=>{try{
    const d=JSON.parse(fr.result);
    if(!d.items)throw Error('형식이 다릅니다');
    for(const k in d.items)if(k.startsWith('jq:')&&k!==KEY)LS.set(k,d.items[k]);
    S.sheet=null;S.err='';render();
  }catch(e){S.err='불러오지 못했습니다: '+e.message;render()}};
  fr.readAsText(file);
}

function wordList(q){
  const out=[],seen=new Set();
  const add=(w,k,y)=>{w=plain(w||'').trim();if(!w||seen.has(w))return;seen.add(w);out.push({w,k:k||'',y:y||''})};
  (q.words||[]).forEach(x=>x&&add(x.w,x.k));
  const hay=plain([q.jp||'',(q.choices||[]).join(''),(q.answers||[]).join(''),
    (q.pairs||[]).map(p=>p.k+p.r).join('')].join(''));
  ((S.set&&S.set.items)||[]).forEach(it=>{
    if(!it||!it.jp)return;
    if(hay.includes(it.jp)){
      const hit=out.find(o=>o.w===it.jp);
      if(hit){if(!hit.k)hit.k=it.ko||'';if(!hit.y)hit.y=it.yomi||''}
      else add(it.jp,it.ko,it.yomi);
    }
  });
  return out;
}
function glossHTML(q){
  const w=wordList(q);
  if(!w.length)return'';
  return `<div class="gloss">${w.map(x=>
    `<div><b class="mincho">${esc(x.w)}</b>${x.y?`<i class="mincho">${esc(x.y)}</i>`:''}<span>${esc(x.k)}</span></div>`
  ).join('')}</div>`;
}

function viewQuiz(){
  const q=S.set.questions[S.qi], last=S.ans[S.qi];
  if(q.type==='match'&&!S.pair)S.pair={sel:null,done:{},miss:0,bad:null,order:shuffle(q.pairs.map((_,i)=>i))};
  const P=S.pair;
  let body='';
  if(q.type==='match'){
    body=`<div class="match" style="margin-top:18px"><div>${q.pairs.map((p,i)=>
      `<button class="tile mincho ${P.sel===i?'sel':''} ${P.done[i]?'done':''}" data-a="k" data-i="${i}">${esc(p.k)}${P.done[i]?MARU:''}</button>`).join('')}</div>
      <div>${P.order.map(i=>
      `<button class="tile mincho ${P.done[i]?'done':''} ${P.bad===i?'bad':''}" style="font-size:20px" data-a="r" data-i="${i}">${esc(q.pairs[i].r)}${P.done[i]?MARU:''}</button>`).join('')}</div></div>
      ${S.locked?'':'<p class="hint">왼쪽 한자 → 오른쪽 읽는 법 순서로 누르세요</p>'}`;
  }else{
    const jp=q.jp?`<div class="jp mincho">${ruby(q.jp,q.type==='short')}</div>`:'<div style="height:16px"></div>';
    if(q.type==='choice'){
      body=jp+q.choices.map((c,i)=>`<button class="choice ${S.locked&&(i===q.answer||i===last.given)?'on':''}"
        data-a="c" data-i="${i}" ${S.locked?'disabled':''}>
        <span class="mk mincho">${ABC[i]}</span><span class="mincho">${ruby(c)}</span>
        ${S.locked&&i===q.answer?MARU:''}${S.locked&&i===last.given&&i!==q.answer?SLASH:''}</button>`).join('');
    }else{
      body=jp+`<input class="short mincho" ${S.locked?'disabled':''}
        value="${esc(S.locked?last.given:S.typed)}" placeholder="${q.type==='short'?'ひらがな':'日本語で'}" data-a="typed">
        ${S.locked?'':`<button class="b-red b-wide" data-a="grade" ${S.typed.trim()?'':'disabled'}>채점하기</button>`}`;
    }
  }
  let fb='';
  if(S.locked){
    const ansTxt=q.type==='choice'?plain(q.choices[q.answer]):(q.answers||[]).join(' / ');
    fb=`<div class="fb"><div class="fb-h ${last.ok?'o':''}">${last.ok?'○ 정답':'✕ 오답'}</div>
      ${!last.ok&&q.type!=='match'?`<p style="margin-bottom:4px">정답 <b class="mincho">${esc(ansTxt)}</b></p>`:''}
      ${!last.ok&&q.type==='match'?`<p style="margin-bottom:4px">${last.given}번 틀렸습니다</p>`:''}
      ${q.explain?`<p>${esc(q.explain)}</p>`:''}
      ${glossHTML(q)}
      ${(q.type==='short'||q.type==='write')&&!last.ok?'<button class="b-ghost" data-a="ovr">사실 맞게 썼어요 (정답 처리)</button>':''}
      <button class="b-red b-wide" data-a="next">${S.qi+1<S.set.questions.length?'다음 문제':'채점 결과 보기'}</button></div>`;
  }
  return head()+`<div class="track">${S.set.questions.map((_,i)=>
    `<div class="cell ${i===S.qi?'now':''}">${S.ans[i]?`<svg viewBox="0 0 40 40"><path d="${S.ans[i].ok?
      'M20 6 C 9 6 5 12 5 20 C 5 28 10 34 20 34 C 30 34 35 28 35 20 C 35 12 30 6 19 6':'M9 31 L31 9'}" stroke-width="3"/></svg>`:''}</div>`).join('')}</div>
    <div class="qno mincho"><span>第${S.qi+1}問</span><i>${'★'.repeat(Math.min(3,Math.max(1,q.level||1)))} ${TYPE[q.type]||''}</i></div>
    <p class="qtext">${esc(q.q)}</p>${body}${fb}
    ${S.locked?'':'<button class="b-ghost b-wide" data-a="home">그만두기</button>'}`;
}

function viewResult(){
  const score=S.ans.filter(a=>a.ok).length,total=S.set.questions.length,rate=score/total;
  const l1=rate>=.9?'大変よく':rate>=.7?'よく':'もう一度', l2=rate>=.7?'できました':'やろう';
  const F="'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif";
  return head()+`<div class="stamp-area"><div class="stamp">
    <svg width="146" height="146" viewBox="0 0 150 150">
    <circle cx="75" cy="75" r="66" fill="none" stroke="#C8322B" stroke-width="4" opacity=".9"/>
    <text x="75" y="68" text-anchor="middle" fill="#C8322B" font-size="26" font-family="${F}">${l1}</text>
    <text x="75" y="100" text-anchor="middle" fill="#C8322B" font-size="22" font-family="${F}">${l2}</text>
    </svg></div><div class="score"><b>${score}</b> / ${total}</div></div>
    <div class="sec">채점표 · ${esc(S.set.title)}</div>
    ${S.set.questions.map((q,i)=>{
      const a=q.type==='choice'?plain(q.choices[q.answer]):q.type==='match'?
        q.pairs.map(p=>p.k+'='+p.r).join(', '):(q.answers||[]).join(' / ');
      return `<div class="rv"><div class="rv-m mincho">${S.ans[i]&&S.ans[i].ok?'○':'✕'}</div>
      <div class="rv-b"><div class="rv-q mincho">${q.type==='match'?esc(q.pairs.map(p=>p.k).join(' · ')):ruby(q.jp)}</div>
      <div class="rv-a">${esc(plain(q.q))}<br>정답 <i class="mincho">${esc(a)}</i>${q.explain?' · '+esc(q.explain):''}</div>
      ${glossHTML(q)}</div></div>`}).join('')}
    <button class="b-red b-wide" data-a="again">같은 시험 다시 풀기</button>
    <button class="b-line b-wide" data-a="regen2">같은 단어로 새 문제 만들기</button>
    <button class="b-line b-wide" data-a="home">처음으로</button>
    <p class="note">틀린 문제는 내일 한 번 더 풀면 훨씬 오래 남습니다.</p>`;
}

/* ═══ 이벤트 ═══ */
async function addShots(list){
  const files=[...list].slice(0,8-S.shots.length);
  for(const f of files){
    try{S.shots.push({full:await shrink(f,1280,.8),thumb:await shrink(f,200,.5)})}catch(e){}
  }
  render();
}
document.getElementById('cam').onchange=e=>{addShots(e.target.files);e.target.value=''};
document.getElementById('pick').onchange=e=>{addShots(e.target.files);e.target.value=''};
document.getElementById('imp').onchange=e=>{if(e.target.files[0])importAll(e.target.files[0]);e.target.value=''};

document.addEventListener('input',e=>{
  const a=e.target.dataset.a;
  if(a==='typed'){S.typed=e.target.value;
    const b=document.querySelector('[data-a="grade"]');if(b)b.disabled=!S.typed.trim()}
  if(a==='rng'){S.want=+e.target.value;
    const n=document.querySelector('.count-n');if(n)n.innerHTML=S.want+'<span>문제</span>';
    const m=document.querySelector('[data-a="make"]');
    if(m)m.textContent=`사진 ${S.shots.length}장으로 ${S.want}문제 만들기`}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.dataset.a==='typed'&&S.typed.trim()&&!S.locked)submit();
});

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a, i=+t.dataset.i, id=t.dataset.id;
  const idx=getJ(IDX,[]);
  switch(a){
    case 'savekey':{const v=document.getElementById('k').value.trim();
      if(!v)return;LS.set(KEY,v);S.err='';render();break}
    case 'savekey2':{LS.set(KEY,document.getElementById('k2').value.trim());
      LS.set(MODEL,document.getElementById('m2').value.trim()||'gemini-3.6-flash');
      S.sheet=null;render();break}
    case 'settings':S.sheet={kind:'settings'};S.test='';render();break;
    case 'test':{
      LS.set(KEY,document.getElementById('k2').value.trim());
      LS.set(MODEL,document.getElementById('m2').value.trim()||'gemini-3.6-flash');
      S.test='테스트 중...';render();
      try{const t=await ask([{text:'JSON 배열로만 답하세요: ["ok"]'}]);S.test='성공 ✓ '+t.slice(0,120)}
      catch(err){S.test='실패 ✕ '+err.message}
      render();break}
    case 'savename':{setJ(PROF,{name:document.getElementById('nm').value.trim()});S.sheet=null;render();break}
    case 'export':exportAll();break;
    case 'import':document.getElementById('imp').click();break;
    case 'veil':if(e.target===t){S.sheet=null;render()}break;
    case 'close':S.sheet=null;render();break;
    case 'cam':document.getElementById('cam').click();break;
    case 'pick':document.getElementById('pick').click();break;
    case 'unshot':S.shots.splice(i,1);render();break;
    case 'minus':S.want=Math.max(10,S.want-10);render();break;
    case 'plus':S.want=Math.min(100,S.want+10);render();break;
    case 'make':fromPhotos();break;
    case 'open':S.sheet=getJ('jq:set:'+id,null);render();break;
    case 'mix':S.sheet={kind:'mix'};render();break;
    case 'tick':S.picked=S.picked.includes(id)?S.picked.filter(x=>x!==id):[...S.picked,id];render();break;
    case 'mixgo':fromHistory();break;
    case 'rename':{const v=document.getElementById('tt').value.trim();if(!v)return;
      const s={...S.sheet,title:v};setJ('jq:set:'+s.id,s);
      setJ(IDX,idx.map(r=>r.id===s.id?{...r,title:v}:r));S.sheet=s;render();break}
    case 'del':{LS.del('jq:set:'+S.sheet.id);
      setJ(IDX,idx.filter(r=>r.id!==S.sheet.id));S.sheet=null;render();break}
    case 'play':{const s=S.sheet;S.sheet=null;begin(s);break}
    case 'regen':regen(S.sheet);break;
    case 'regen2':regen(S.set);break;
    case 'again':begin(S.set);break;
    case 'home':S.view='home';S.err='';render();break;
    case 'c':submit(i);break;
    case 'grade':submit();break;
    case 'ovr':S.ans[S.ans.length-1].ok=true;render();break;
    case 'next':next();break;
    case 'k':{if(S.locked||S.pair.done[i])return;
      S.pair.sel=S.pair.sel===i?null:i;S.pair.bad=null;render();break}
    case 'r':{const P=S.pair;const q=S.set.questions[S.qi];
      if(S.locked||P.sel==null||P.done[i])return;
      if(P.sel===i){P.done[i]=true;P.sel=null;P.bad=null;
        if(Object.keys(P.done).length===q.pairs.length){mark(P.miss===0,P.miss);return}
      }else{P.miss++;P.bad=i;P.sel=null}
      render();break}
  }
});
render();
</script>
</body>
</html>
